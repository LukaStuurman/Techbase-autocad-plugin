name: Export main source snapshot

on:
  push:
    branches: [chore/source-snapshot-v120]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: main-source-snapshot
          path: |
            src/**
            Build.ps1
            PrepareEnexis.ps1
            PackageContents.xml
            Assets/**
            README.md
            LEESMIJ.md
            Installeren.ps1
            Installeren.cmd
            Lettertype.ps1
            vendor/**
            tests/**
            Reference/**
            .gitattributes
          retention-days: 1
