name: Import Techbase v1.20.1 sources

on:
  push:
    branches: [upgrade/v1.20.1-stationslocaties]

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ !contains(github.event.head_commit.message, '[source-imported]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/v1.20.1-stationslocaties
          persist-credentials: true
      - name: Verify upload and apply 1.20.1 source changes
        shell: bash
        run: |
          set -euo pipefail
          echo "3a541ca0bf92341c7ad2c4093d07860d4ece40b2308da12774c4a8d4e3659998  tools/import/Techbase-v1.20.1-final-delta.tar.xz" | sha256sum -c -
          tar -xJf "tools/import/Techbase-v1.20.1-final-delta.tar.xz" -C . --no-same-owner --no-same-permissions
          git rm -f "tools/import/Techbase-v1.20.1-final-delta.tar.xz" ".github/workflows/import-v120.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No source changes found"; exit 1; }
          git commit -m "Import Techbase v1.20.1 with native Stationslocaties [source-imported]"
          git push origin HEAD:upgrade/v1.20.1-stationslocaties
