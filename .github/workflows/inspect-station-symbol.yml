name: Inspect standard station symbol
on:
  push:
    branches:
      - feature/zro-shared-trafo-topo-percelen-v1.21.1
    paths:
      - .github/workflows/inspect-station-symbol.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect standard station symbols
        shell: bash
        run: |
          python - <<'PY'
          import gzip,json
          p='src/Stationslocaties/Resources/StationGeometry.json.gz'
          data=json.loads(gzip.open(p,'rb').read())
          print('ROOT',list(data.keys()))
          for key,value in data.items():
            if 'symbol' in key.lower():
              print('SYMBOL',json.dumps(value,ensure_ascii=False)[:11000])
          PY
